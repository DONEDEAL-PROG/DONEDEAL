<body>
<header><h1>DONE DEAL</h1><div class="subtitle">PRIVATE ADMIN DASHBOARD</div></header>
<main><div style="margin:0 0 18px"><a href="/admin/master-ledger.html" style="display:inline-block;background:#fff;color:#96396c;padding:12px 16px;border:1px solid #e4c5d6;border-radius:12px;text-decoration:none;font-weight:800">Master Price Ledger ↗</a></div><div style="margin:0 0 18px"><a href="/admin/operations.html" style="display:inline-block;background:#e83291;color:#fff;padding:13px 17px;border-radius:12px;text-decoration:none;font-weight:800">＋ Add Gadget &amp; Manage Orders →</a></div>
<section id="loginPanel" class="panel">
<h2>Admin Sign In</h2>
<form id="loginForm">
<label for="password">Admin password</label>
<input id="password" type="password" autocomplete="current-password" required>
<button type="submit" style="width:100%;margin-top:14px">Sign In</button>
</form>
<p id="loginMessage" class="notice" role="status"></p>
</section>
<section id="dashboard">
<div class="panel">
<div class="productHead"><div><h2 style="margin:0 0 8px">Product Manager</h2><p class="subtitle" style="margin:0">Browse by brand, search, then edit a gadget</p></div><button class="secondary" id="refreshBtn">Refresh</button></div>
<p id="status" role="status"></p>
<div class="toolbar"><input id="productSearch" type="search" placeholder="Search brand, model, storage or SKU..." aria-label="Search products"></div>
<div id="brandTabs" class="brands" aria-label="Filter by brand"></div>
</div>
<div id="products"></div>
<div id="emptyState">No matching gadgets. Try another search or brand.</div>
</section>
</main>
<datalist id="ddStorageSuggestions"><option value="128GB"><option value="256GB"><option value="512GB"><option value="1TB"><option value="8GB / 128GB"><option value="8GB / 256GB"><option value="12GB / 256GB"><option value="12GB / 512GB"><option value="16GB / 1TB"></datalist>
<script>
const $ = id => document.getElementById(id);
const money = cents => (cents / 100).toFixed(2);
const knownBrands = ["Apple","Samsung","Huawei","OPPO","vivo","Xiaomi"];
let allProducts = [];
let selectedBrand = null;
let ddMasterPrices = [];
function showDashboard() {
  $("loginPanel").style.display = "none";
  $("dashboard").style.display = "block";
}
function showLogin() {
  $("loginPanel").style.display = "block";
  $("dashboard").style.display = "none";
}
function brandOf(item) {
  const prefix = String(item.sku || "").split("-")[0];
  return knownBrands.find(b => b.toLowerCase() === prefix.toLowerCase()) ||
    knownBrands.find(b => String(item.name || "").toLowerCase().startsWith(b.toLowerCase())) ||
    "Other";
}
function imageUrl(key) {
  return typeof key === "string" && /^products\/[0-9a-f-]{36}\.(jpg|png|webp)$/.test(key)
    ? "/api/images/" + key : null;
}
async function loadProducts() {
  $("status").textContent = "Loading products...";
  try {
    const response = await fetch("/api/admin/products", {
      credentials: "same-origin", cache: "no-store"
    });
    if (response.status === 401) {
      showLogin();
      $("loginMessage").textContent = "Please sign in to continue.";
      return;
    }
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Unable to load products.");
    allProducts = Array.isArray(data.products) ? data.products : [];
    try {
      const ledgerResponse=await fetch('/api/admin/master-prices',{credentials:'same-origin',cache:'no-store'});
      if(ledgerResponse.ok){const ledgerData=await ledgerResponse.json();ddMasterPrices=ledgerData.prices||[];}
    } catch(e) {}
    showDashboard();
    updateList();
  } catch (error) {
    $("status").textContent = error.message;
  }
}
function updateTabs() {
  const tabs=$("brandTabs");
  tabs.replaceChildren();
  if(selectedBrand===null){
    tabs.classList.add("dd-brand-home");
    $("productSearch").style.display="none";
    for(const brand of [...knownBrands,...(allProducts.some(p=>brandOf(p)==="Other")?["Other"]:[])]){
      const items=allProducts.filter(p=>brandOf(p)===brand);
      if(!items.length)continue;
      const tile=document.createElement("button");
      tile.type="button";tile.className="dd-brand-tile";
      const label=document.createElement("strong");label.textContent=brand;
      const count=document.createElement("span");
      count.textContent=new Set(items.map(p=>p.sku.split("::")[0])).size+" gadget models · "+items.length+" variants";
      tile.append(label,count);
      tile.onclick=()=>{selectedBrand=brand;updateList();};
      tabs.append(tile);
    }
  }else{
    tabs.classList.remove("dd-brand-home");
    $("productSearch").style.display="";
    const back=document.createElement("button");
    back.type="button";back.className="dd-back-brands";
    back.textContent="← Back to Brands";
    back.onclick=()=>{selectedBrand=null;$("productSearch").value="";updateList();};
    const heading=document.createElement("strong");
    heading.className="dd-selected-brand";heading.textContent=selectedBrand+" — Gadget Inventory";
    tabs.append(back,heading);
  }
}
function updateList() {
  updateTabs();
  $("products").replaceChildren();
  if(selectedBrand===null){
    $("status").textContent="Choose a brand to view its gadget inventory";
    $("emptyState").style.display="none";
    return;
  }
  const q=$("productSearch").value.trim().toLowerCase();
  const visible=allProducts.filter(p=>brandOf(p)===selectedBrand &&
    [p.name,p.variant,p.sku].join(" ").toLowerCase().includes(q));
  $("status").textContent=selectedBrand+": "+visible.length+" storage variants";
  $("emptyState").style.display=visible.length?"none":"block";
  const sorted=[...visible].sort((a,b)=>a.name.localeCompare(b.name)||a.variant.localeCompare(b.variant));
  for(const item of sorted)renderProduct(item);
}
async function adminVariantPost(payload){
 const response=await fetch('/api/admin/variants',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
 const data=await response.json();
 if(!response.ok)throw Error(data.error||'Unable to update gadget');
 return data;
}
function renderGadgetControls(item){
 const id=item.sku.split('::')[0];
 const panel=document.createElement('section');panel.className='panel gadgetControls';panel.style.marginTop='18px';
 const heading=document.createElement('div');heading.className='productHead';
 const title=document.createElement('strong');title.textContent=item.name+' — Storage & Pricing';
 const toggle=document.createElement('button');toggle.type='button';toggle.className='secondary';
 const active=Number(item.gadget_enabled)!==0;
 toggle.textContent=active?'Deactivate Gadget':'Activate Gadget';
 const deleteGadget=document.createElement('button');
 deleteGadget.type='button';deleteGadget.className='secondary';deleteGadget.textContent='Delete Entire Gadget';
 deleteGadget.style.border='1px solid #e35b8e';
 heading.append(title,toggle,deleteGadget);panel.append(heading);
 deleteGadget.onclick=async()=>{
  deleteGadget.disabled=true;
  try{
   const info=await adminVariantPost({action:'inspect_gadget',product_id:id});
   if(info.active){alert('⚠ This gadget is in '+info.active+' active order(s). Deactivate the gadget first; deletion is blocked until all orders are delivered or cancelled.');return;}
   if(!confirm('Delete ALL '+info.variants+' storage variants of '+item.name+'? '+info.total+' historical order(s) will remain saved.'))return;
   if(!confirm('FINAL CONFIRMATION: Delete the entire gadget permanently?'))return;
   await adminVariantPost({action:'delete_gadget',product_id:id});
   await loadProducts();
   alert('✓ Gadget deleted. Historical orders preserved.');
  }catch(e){alert(e.message);}
  finally{deleteGadget.disabled=false;}
 };

 const info=document.createElement('small');info.textContent='Each storage below has its own price, stock and Active toggle. New storage starts Deactivated.';
 panel.append(info);
 const add=document.createElement('button');add.type='button';add.className='secondary';
 add.textContent='+ Add Storage Variant';add.style.marginTop='12px';panel.append(add);
 const form=document.createElement('div');form.className='editor';form.style.marginTop='12px';
 const row=document.createElement('div');row.className='fields';
 function field(label,type,placeholder){
  const box=document.createElement('label');box.textContent=label;
  const input=document.createElement('input');input.type=type;input.placeholder=placeholder;
  if(type==='number'){input.min='0';input.step=label==='Price (PHP)'?'0.01':'1';}
  box.append(input);row.append(box);return input;
 }
 const storage=field('Storage / RAM','text','128GB, 256GB, 12GB / 512GB');
 storage.setAttribute('list','ddStorageSuggestions');
 const price=field('Price (PHP)','number','0.00');
 const lockNote=document.createElement('small');lockNote.style.display='block';lockNote.style.margin='6px 0 10px';
 price.after(lockNote);
 function syncVariantLedgerPrice(){
  const variant=storage.value.trim().toLowerCase();
  const official=ddMasterPrices.find(p=>p.device_name.trim().toLowerCase()===item.name.trim().toLowerCase()&&p.variant.trim().toLowerCase()===variant);
  if(official){price.value=(official.price_centavos/100).toFixed(2);price.readOnly=true;lockNote.textContent='🔒 Price set by Master Price Ledger';}
  else{price.readOnly=false;lockNote.textContent='Manual price allowed — not in ledger';}
 }
 storage.addEventListener('input',syncVariantLedgerPrice);
 syncVariantLedgerPrice();
 const stock=field('Stock','number','0');stock.value='0';
 const save=document.createElement('button');save.type='button';save.textContent='Save New Variant (Deactivated)';
 const message=document.createElement('small');message.setAttribute('role','status');
 form.append(row,save,message);panel.append(form);
 add.onclick=()=>{form.classList.toggle('open');};
 toggle.onclick=async()=>{
  const next=active?0:1;
  if(!confirm((next?'Activate':'Deactivate')+' all storage variants for '+item.name+'?'))return;
  toggle.disabled=true;
  try{await adminVariantPost({action:'gadget',product_id:id,enabled:next});await loadProducts();}
  catch(e){info.textContent=e.message;toggle.disabled=false;}
 };
 save.onclick=async()=>{
  const raw=price.value.trim(),rawStock=stock.value.trim();
  const cents=Math.round(Number(raw)*100);
  if(!storage.value.trim()||!/^[0-9]+(\.[0-9]{1,2})?$/.test(raw)||cents<1||!/^[0-9]+$/.test(rawStock)){message.textContent='Enter storage, valid price and stock.';return;}
  save.disabled=true;message.textContent='Saving...';
  try{
   const result=await adminVariantPost({action:'create',product_id:id,storage:storage.value.trim(),price_centavos:cents,stock:Number(rawStock)});
   // A successful create refreshes the list; highlight and expand the newly created card.
   const newSku=result.sku||id+'::'+storage.value.trim();
   const search=$('productSearch');
   if(search)search.value='';
   await loadProducts();
   const newCard=Array.from(document.querySelectorAll('#products .product')).find(el=>el.dataset.sku===newSku);
   if(!newCard)throw Error('Variant saved, but its card was not found after refresh. Reload the admin page to see it.');
   if(newCard){
     const edit=newCard.querySelector('.editBtn');
     if(edit)edit.click();
     newCard.style.outline='3px solid #ff3e9e';
     newCard.style.outlineOffset='3px';
     newCard.scrollIntoView({behavior:'smooth',block:'center'});
   }
   const toast=document.createElement('div');
   toast.setAttribute('role','status');
   toast.textContent='✓ Storage Variant Added Successfully! '+storage.value.trim()+' — Deactivated. Activate it when ready.';
   toast.style.cssText='position:fixed;z-index:99999;top:18px;left:50%;transform:translateX(-50%);max-width:min(92vw,620px);background:#22212b;border:2px solid #ff3e9e;border-radius:14px;padding:18px 22px;color:#fff;font-weight:800;box-shadow:0 15px 50px #000b;text-align:center';
   document.body.append(toast);
   setTimeout(()=>toast.remove(),6500);
  }catch(e){message.textContent=e.message;save.disabled=false;}
 };
 return panel;
}
function renderProduct(item) {
  const card = document.createElement("article");
  card.className = "product";
  card.dataset.sku = item.sku;
  const head = document.createElement("div");
  head.className = "productHead";
  const identity = document.createElement("div");
  identity.className = "identity";
  const thumb = document.createElement("div");
  thumb.className = "thumb thumbEmpty";
  thumb.textContent = "No photo";
  function setThumb(key) {
    const src = imageUrl(key);
    thumb.replaceChildren();
    if (src) {
      const img = document.createElement("img");
      img.src = src;
      img.alt = item.name;
      img.className = "thumb";
      img.onerror = () => { thumb.replaceChildren(); thumb.textContent = "No photo"; };
      thumb.append(img);
    } else thumb.textContent = "No photo";
  }
  setThumb(item.image_key);
  const title = document.createElement("div");
  const name = document.createElement("strong");
  name.textContent = item.name;
  const details = document.createElement("small");
  details.className = "dd-storage-label";
  const variantName = String(item.variant || "").trim();
  details.textContent = "STORAGE  •  " + (variantName && variantName.toLowerCase() !== "to be set" ? variantName : "NOT SET");
  const skuNote = document.createElement("small");
  skuNote.className = "dd-sku-note";
  skuNote.textContent = item.sku;
  const summary = document.createElement("small");
  summary.textContent = "₱" + money(item.price_centavos) +
    " · Stock: " + item.stock + " · " + (item.enabled === 1 ? "Available" : "Not for sale");
  title.append(name,details,summary,skuNote);
  identity.append(thumb,title);
  const toggle = document.createElement("button");
  toggle.type = "button";
  toggle.className = "secondary editBtn";
  toggle.textContent = "Edit";
  head.append(identity,toggle);
  const editor = document.createElement("div");
  editor.className = "editor";
  toggle.addEventListener("click", () => {
    const open = editor.classList.toggle("open");
    toggle.textContent = open ? "Close" : "Edit";
    toggle.setAttribute("aria-expanded", String(open));
  });
  toggle.setAttribute("aria-expanded","false");
  const fields = document.createElement("div");
  fields.className = "fields";
  const priceBox = document.createElement("div");
  const priceLabel = document.createElement("label");
  priceLabel.textContent = "Price (PHP)";
  const price = document.createElement("input");
  price.type = "number";price.min = "0.01";price.step = "0.01";
  price.value = money(item.price_centavos);
  const priceLocked=item.master_price_centavos!==null && item.master_price_centavos!==undefined;
  if(priceLocked){
    price.value=money(item.master_price_centavos);
    price.readOnly=true;
    price.title='Price controlled by Master Price Ledger';
    const hint=document.createElement('small');
    hint.textContent='🔒 Official price — edit only in Master Price Ledger';
    hint.style.display='block';hint.style.marginTop='6px';
    priceBox.append(hint);
  }
  priceBox.append(priceLabel,price);
  const stockBox = document.createElement("div");
  const stockLabel = document.createElement("label");
  stockLabel.textContent = "Stock";
  const stock = document.createElement("input");
  stock.type = "number";stock.min = "0";stock.step = "1";stock.value = item.stock;
  stockBox.append(stockLabel,stock);
  fields.append(priceBox,stockBox);
  const renameBox=document.createElement('div');
  const renameLabel=document.createElement('label');renameLabel.textContent='Storage / RAM';
  const renameInput=document.createElement('input');renameInput.type='text';renameInput.maxLength=120;
  renameInput.value=item.variant;renameInput.setAttribute('list','ddStorageSuggestions');
  renameBox.append(renameLabel,renameInput);fields.prepend(renameBox);
  const rename=document.createElement('button');rename.type='button';rename.className='secondary';
  rename.textContent='Save Storage Name (Deactivates New Variant)';
  const renameMsg=document.createElement('small');renameMsg.setAttribute('role','status');
  rename.onclick=async()=>{
   if(!renameInput.value.trim()){renameMsg.textContent='Enter a storage name before saving.';return;}
   if(renameInput.value.trim()===item.variant){renameMsg.textContent='Storage name is unchanged.';return;}
   if(!confirm('Rename storage? The original variant will be deactivated and the new name starts Deactivated. Price and stock are copied.'))return;
   rename.disabled=true;renameMsg.textContent='Renaming...';
   try{await adminVariantPost({action:'rename',product_id:item.sku.split('::')[0],sku:item.sku,storage:renameInput.value.trim()});await loadProducts();}
   catch(e){renameMsg.textContent=e.message;rename.disabled=false;}
  };
  fields.append(renameBox); 

  const actions = document.createElement("div");
  actions.className = "actions";
  const available = document.createElement("input");
  available.type = "checkbox";available.checked = item.enabled === 1;
  const availableLabel = document.createElement("label");
  availableLabel.style.margin = "0";
  availableLabel.append(available," Available for sale");
  const save = document.createElement("button");
  save.type = "button";save.textContent = "Save Changes";
  const message = document.createElement("small");
  message.setAttribute("role","status");
  save.addEventListener("click", async () => {
    const rawPrice = price.value.trim();
    const rawStock = stock.value.trim();
    const php = Number(rawPrice);
    const quantity = Number(rawStock);
    const cents = Math.round(php * 100);
    if (!/^\d+(\.\d{1,2})?$/.test(rawPrice) ||
        !Number.isSafeInteger(cents) || cents < 1 ||
        !/^\d+$/.test(rawStock) || !Number.isSafeInteger(quantity)) {
      message.textContent = "Enter a valid price and stock.";
      message.className = "notice";
      return;
    }
    save.disabled = true;message.textContent = "Saving...";
    try {
      const response = await fetch("/api/admin/products", {
        method:"POST",credentials:"same-origin",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({sku:item.sku,price_centavos:cents,
          stock:quantity,enabled:available.checked ? 1 : 0})
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Save failed.");
      item.price_centavos = cents;
      item.stock = quantity;
      item.enabled = available.checked ? 1 : 0;
      summary.textContent = "₱" + money(cents) + " · Stock: " + quantity +
        " · " + (item.enabled === 1 ? "Available" : "Not for sale");
      message.textContent = "Saved successfully!";
      message.className = "success";
    } catch (error) {
      message.textContent = error.message;
      message.className = "notice";
    } finally { save.disabled = false; }
  });
  actions.append(availableLabel,save,message,rename,renameMsg);
  const deleteVariant=document.createElement('button');
  deleteVariant.type='button';deleteVariant.className='secondary';
  deleteVariant.textContent='Delete This Storage Variant';
  deleteVariant.style.border='1px solid #e35b8e';
  const deleteNotice=document.createElement('small');deleteNotice.setAttribute('role','status');
  deleteVariant.onclick=async()=>{
   deleteVariant.disabled=true;deleteNotice.textContent='Checking existing orders...';
   const productId=item.sku.split('::')[0];
   try{
    const info=await adminVariantPost({action:'inspect',product_id:productId,sku:item.sku});
    if(info.active){
     deleteNotice.textContent='⚠ '+info.active+' active order(s) contain this variant. Permanent deletion blocked; uncheck Available for sale and click Save Changes to deactivate.';
     alert('⚠ This variant is in '+info.active+' active order(s). You can DEACTIVATE it now, but cannot delete until all orders are delivered or cancelled.');
     return;
    }
    const warning=info.total?'⚠ '+info.total+' completed/cancelled order(s) reference this variant. Order history will remain intact.':'No existing orders reference this variant.';
    if(!confirm(warning+'\\n\\nPermanently delete '+item.name+' — '+item.variant+'? This cannot be undone.'))return;
    if(!confirm('FINAL CONFIRMATION: Permanently delete this storage variant?'))return;
    await adminVariantPost({action:'delete',product_id:productId,sku:item.sku});
    await loadProducts();
    alert('✓ Storage variant deleted permanently. Order history preserved.');
   }catch(e){deleteNotice.textContent=e.message;alert(e.message);}
   finally{deleteVariant.disabled=false;}
  };
  actions.append(deleteVariant,deleteNotice);
  const photoArea = document.createElement("div");
  photoArea.className = "photoArea";
  const photoLabel = document.createElement("label");
  photoLabel.textContent = "Product Photo";
  const preview = document.createElement("img");
  preview.className = "photoPreview";preview.alt = item.name + " photo";
  preview.style.display = imageUrl(item.image_key) ? "block" : "none";
  if (imageUrl(item.image_key)) preview.src = imageUrl(item.image_key);
  const imageInput = document.createElement("input");
  imageInput.type = "file";imageInput.accept = "image/jpeg,image/png,image/webp";
  const upload = document.createElement("button");
  upload.type = "button";
  upload.textContent = item.image_key ? "Replace Photo" : "Upload Photo";
  const photoMessage = document.createElement("small");
  photoMessage.style.display = "block";photoMessage.style.marginTop = "10px";
  photoMessage.setAttribute("role","status");
  let objectUrl = null;
  imageInput.addEventListener("change", () => {
    const file = imageInput.files?.[0];
    if (!file) return;
    if (!["image/jpeg","image/png","image/webp"].includes(file.type) ||
        file.size === 0 || file.size > 5*1024*1024) {
      photoMessage.textContent = "Choose JPG, PNG or WebP under 5MB.";
      photoMessage.className = "notice";imageInput.value = "";return;
    }
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(file);
    preview.src = objectUrl;preview.style.display = "block";
    photoMessage.textContent = "Preview ready. Click Upload Photo.";
    photoMessage.className = "";
  });
  upload.addEventListener("click", async () => {
    const file = imageInput.files?.[0];
    if (!file) {photoMessage.textContent = "Choose a photo first.";return;}
    const productId = item.sku.split("::")[0];
    if (!/^(?:[A-Za-z]+-\d+|custom-[0-9a-f-]{36})$/.test(productId)) {
      photoMessage.textContent = "Invalid product ID.";return;
    }
    upload.disabled = true;imageInput.disabled = true;
    photoMessage.textContent = "Uploading photo...";
    try {
      const form = new FormData();form.append("image",file);
      const uploaded = await fetch("/api/admin/upload-image",{
        method:"POST",credentials:"same-origin",body:form
      });
      const uploadData = await uploaded.json();
      if (!uploaded.ok) throw new Error(uploadData.error || "Image upload failed.");
      photoMessage.textContent = "Saving product photo...";
      const saved = await fetch("/api/admin/product-image",{
        method:"POST",credentials:"same-origin",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({product_id:productId,image_key:uploadData.key})
      });
      const saveData = await saved.json();
      if (!saved.ok) throw new Error(saveData.error || "Unable to save product photo.");
      item.image_key = uploadData.key;
      preview.src = uploadData.image_url;
      setThumb(item.image_key);
      upload.textContent = "Replace Photo";
      imageInput.value = "";
      if (objectUrl) { URL.revokeObjectURL(objectUrl);objectUrl = null; }
      photoMessage.textContent = "Photo saved successfully!";
      photoMessage.className = "success";
      // The photo belongs to the gadget model, shared across storage variants.
      const productPrefix = productId + "::";
      allProducts.filter(p => p.sku.startsWith(productPrefix))
        .forEach(p => {p.image_key = uploadData.key;});
    } catch (error) {
      photoMessage.textContent = error.message;photoMessage.className = "notice";
    } finally {upload.disabled = false;imageInput.disabled = false;}
  });
  photoArea.append(photoLabel,preview,imageInput,upload,photoMessage);
  editor.append(fields,actions,renderGadgetControls(item),photoArea);
  card.append(head,editor);
  $("products").append(card);
}
$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  $("loginMessage").textContent = "Signing in...";
  try {
    const response = await fetch("/api/admin/login",{
      method:"POST",headers:{"Content-Type":"application/json"},
      credentials:"same-origin",
      body:JSON.stringify({password:$("password").value})

    if (!response.ok) throw new Error("Invalid login.");

    showDashboard();
    await loadProducts();
  } catch (error) {$("loginMessage").textContent = error.message;}
});

$("refreshBtn").addEventListener("click",loadProducts);
loadProducts();
