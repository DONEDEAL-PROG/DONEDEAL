<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DONEDEAL | Staff Activity Logs</title>
<style>
:root{color-scheme:light;--pink:#a63871;--border:#e6dfe3}
*{box-sizing:border-box}
body{margin:0;background:#f5f3f2;color:#29252b;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:#fff;border-bottom:1px solid var(--border);padding:20px max(4%,18px)}
header strong{font-size:23px;letter-spacing:.04em}
header small{display:block;color:var(--pink);font-weight:700;letter-spacing:.09em}
main{max-width:1200px;margin:30px auto;padding:0 18px}
a{color:var(--pink)}
nav{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:clamp(24px,4vw,34px);margin:0 0 5px}
.subtitle{color:#746b75;margin:0 0 22px}
.panel{background:#fff;border:1px solid var(--border);border-radius:14px;padding:22px;box-shadow:0 4px 18px #3620320b}
.controls{display:grid;grid-template-columns:minmax(180px,1fr) 210px auto;gap:12px;align-items:end}
label{display:block;color:#59535c;font-size:13px;font-weight:700}
input,select,button{font:inherit;border-radius:9px;padding:11px 12px}
input,select{width:100%;margin-top:6px;background:#fbfafb;border:1px solid #d9d1d8;color:#29252b}
button{background:var(--pink);border:1px solid var(--pink);color:white;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
#status{min-height:24px;margin:18px 0;color:#675e67}
.tableWrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:left}
th{color:#726873;font-size:12px;text-transform:uppercase;letter-spacing:.07em;background:#faf7f9}
th,td{padding:14px 12px;border-bottom:1px solid #eee8ec;vertical-align:top}
td{overflow-wrap:anywhere}
tr:last-child td{border-bottom:0}
.actor{font-weight:750}
.meta{display:block;color:#827981;font-size:12px;margin-top:4px}
.action{display:inline-block;border:1px solid #e6c6d8;border-radius:7px;background:#f8edf3;color:#85345d;padding:4px 8px;font-size:12px;font-weight:750}
.target{font-size:12px;word-break:break-word}
details{max-width:400px}.detail-list{margin:8px 0 0;display:grid;gap:7px}.detail-line{display:grid;gap:2px;padding:7px 9px;background:#f8f5f7;border-radius:7px}.detail-key{font-size:11px;font-weight:800;color:#716771;text-transform:uppercase;letter-spacing:.03em}.detail-value{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.detail-summary{font-size:12px;color:#6d606c;margin-top:4px}
summary{color:var(--pink);cursor:pointer;font-weight:650}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;background:#f8f5f7;border-radius:8px;padding:10px;max-height:250px;overflow:auto}
.empty{text-align:center;color:#827981;padding:35px 10px}
@media(max-width:720px){.controls{grid-template-columns:1fr}.panel{padding:14px}th,td{padding:11px 8px;font-size:13px}}
</style>
<link rel="stylesheet" href="/admin/dd-shell.css">
</head>
<body>
<header><strong>DONEDEAL</strong><small>PRIVATE ADMIN DASHBOARD</small></header>
<main>
<nav aria-label="Admin navigation">
<a href="/admin/">← Admin Dashboard</a>
<a href="/admin/staff-refunds.html">Refund Approvals</a>
</nav>
<h1>Staff Activity Logs</h1>
<p class="subtitle">Admin-only history of recorded staff and administrative actions. Latest 200 entries.</p>
<section class="panel">
<div class="controls">
<label for="search">Search activity
<input id="search" type="search" placeholder="Staff name, action, order ID, details…">
</label>
<label for="filter">Filter by action
<select id="filter"><option value="">All actions</option></select>
</label>
<button id="refresh" type="button">Refresh Logs</button>
</div>
<p id="status" role="status" aria-live="polite">Loading activity logs…</p>
<div class="tableWrap">
<table>
<thead><tr><th scope="col">Date / Time</th><th scope="col">Actor</th><th scope="col">Action</th><th scope="col">Target</th><th scope="col">Details</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
<p id="empty" class="empty" hidden>No matching activity records.</p>
</section>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
let logs=[];
const actionNames={
 staff_create:"Staff account created",
 staff_update:"Staff account updated",
 order_customer_edit:"Customer details edited",
 order_payment_method:"Payment method changed",
 order_cancel:"Order cancelled",
 refund_request:"Refund requested",
 refund_review:"Refund reviewed",
 ticket_assign:"Ticket assigned"
};
function labelAction(value){
 const key=String(value||"");
 return actionNames[key]||key.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase())||"Unknown";
}
function readableDate(value){
 if(!value)return "—";
 const raw=String(value).trim();
 const normalized=/^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$/.test(raw)?raw.replace(" ","T")+"Z":raw;
 const date=new Date(normalized);
 return Number.isNaN(date.getTime())?raw:date.toLocaleString("en-PH",{dateStyle:"medium",timeStyle:"short",timeZone:"Asia/Manila"});
}
function cell(row,value,cls){
 const td=document.createElement("td");
 if(cls)td.className=cls;
 td.textContent=value;
 row.append(td);
 return td;
}
function render(){
 const q=$("search").value.trim().toLowerCase();
 const action=$("filter").value;
 const visible=logs.filter(log=>{
  if(action&&log.action!==action)return false;
  const haystack=[log.actor_type,log.actor_id,log.staff_name,log.staff_username,log.action,labelAction(log.action),log.target_id,log.details,log.created_at].map(v=>String(v??"")).join(" ").toLowerCase();
  return haystack.includes(q);
 });
 const body=$("rows");body.replaceChildren();
 for(const log of visible){
  const tr=document.createElement("tr");
  cell(tr,readableDate(log.created_at));
  const actor=cell(tr,log.actor_type==="staff"?(log.staff_name||log.staff_username||"Staff"):"Admin","actor");
  const actorMeta=document.createElement("span");
  actorMeta.className="meta";
  actorMeta.textContent=log.actor_type==="staff"?(log.staff_username?"@"+log.staff_username+" · ":"")+"Staff":"Admin";
  actor.append(actorMeta);
  const actionTd=cell(tr,"");
  const badge=document.createElement("span");
  badge.className="action";badge.textContent=labelAction(log.action);
  actionTd.append(badge);
  cell(tr,log.target_id||"—","target");
  const detailTd=cell(tr,"");
  if(log.details){
   const details=document.createElement("details");
   const summary=document.createElement("summary");summary.textContent="View details";
   const content=document.createElement("div");content.className="detail-list";
   let data;
   try{data=JSON.parse(log.details)}catch{data=log.details}
   const labels={
    status:"Decision",note:"Admin note",reason:"Reason",
    request_id:"Refund request ID",order_id:"Order ID",
    customer_name:"Customer name",name:"Name",phone:"Phone",
    address:"Address",payment_method:"Payment method",
    old_method:"Previous payment method",new_method:"New payment method",
    changed_fields:"Fields changed",changes:"Changes",
    permissions:"Permissions",username:"Username"
   };
   const show=(key,value)=>{
    if(value===null||value===undefined||value==="")return;
    const line=document.createElement("div");line.className="detail-line";
    const heading=document.createElement("span");heading.className="detail-key";
    heading.textContent=labels[key]||String(key).replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());
    const text=document.createElement("span");text.className="detail-value";
    if(typeof value==="object")text.textContent=JSON.stringify(value,null,2);
    else if(typeof value==="boolean")text.textContent=value?"Yes":"No";
    else text.textContent=String(value);
    if(key==="status")text.textContent=String(value).replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());
    line.append(heading,text);content.append(line);
   };
   if(data&&typeof data==="object"&&!Array.isArray(data)){
    const keys=Object.keys(data);
    for(const key of ["status","note","reason","changes","changed_fields",...keys]){
     if(Object.prototype.hasOwnProperty.call(data,key)&&!content.querySelector('[data-key="'+key+'"]')){
      show(key,data[key]);
      const last=content.lastElementChild;if(last)last.dataset.key=key;
     }
    }
   }else show("Details",data);
   details.append(summary,content);detailTd.append(details);
  }else detailTd.textContent="—";
  body.append(tr);
 }
 $("empty").hidden=visible.length>0;
 $("status").textContent=`Showing ${visible.length} of ${logs.length} loaded activity records`;
}
async function load(){
 const button=$("refresh");button.disabled=true;
 $("status").textContent="Loading activity logs…";
 try{
  const response=await fetch("/api/admin/staff-activity?limit=200",{credentials:"same-origin",cache:"no-store"});
  let data;
  try{data=await response.json()}catch{throw Error("Unexpected server response")}
  if(response.status===401||response.status===403)throw Error("Admin sign-in required. Open the Admin Dashboard and sign in, then return here.");
  if(!response.ok)throw Error(data.error||"Unable to load activity logs");
  logs=Array.isArray(data.logs)?data.logs:[];
  const previous=$("filter").value;
  const actions=[...new Set(logs.map(x=>x.action).filter(Boolean))].sort();
  $("filter").replaceChildren(new Option("All actions",""));
  for(const a of actions)$("filter").add(new Option(labelAction(a),a));
  $("filter").value=actions.includes(previous)?previous:"";
  render();
 }catch(e){
  logs=[];$("rows").replaceChildren();$("empty").hidden=true;
  $("status").textContent=e.message;
 }finally{button.disabled=false}
}
$("search").addEventListener("input",render);
$("filter").addEventListener("change",render);
$("refresh").addEventListener("click",load);
load();
</script>
<script src="/admin/dd-shell.js"></script>
</body>
</html>
