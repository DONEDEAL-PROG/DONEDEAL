<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DONEDEAL | Customers</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f2f2;color:#211c21;font:14px system-ui,sans-serif}header{padding:20px 28px;background:#fff;border-bottom:1px solid #e9dfe5}main{max-width:1200px;margin:25px auto;padding:0 20px}h1{margin:0;font-size:25px}h2{font-size:18px}p{color:#756b73}.panel{background:#fff;border:1px solid #eadfe6;border-radius:15px;padding:20px;margin-bottom:16px}input,select,button{font:inherit;border-radius:9px;padding:10px;border:1px solid #ddd1d9}input,select{background:#fff;color:#241d22;max-width:100%}button{background:#d93683;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}label{display:block;margin:10px 0 5px;font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.metric{padding:17px;border-radius:12px;background:#faf4f7}.metric strong{display:block;font-size:23px;margin-top:8px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:12px;border-bottom:1px solid #eee3e9;vertical-align:top}th{font-size:12px;color:#776a72}tr:hover{background:#fcf7fa}.muted{color:#796d75}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.actions>*{flex:1;min-width:140px}.notice{color:#9d2d66}#editor{display:none}.pill{background:#f9e6ef;border-radius:20px;padding:5px 10px}body:has([data-dd-theme="dark"]),html[data-dd-theme="dark"] body{background:#15131a;color:#f6f0f5}html[data-dd-theme="dark"] header,html[data-dd-theme="dark"] .panel{background:#24212b;border-color:#423644}html[data-dd-theme="dark"] .metric{background:#312835}html[data-dd-theme="dark"] input,html[data-dd-theme="dark"] select{background:#302b36;color:#fff;border-color:#544757}html[data-dd-theme="dark"] p,html[data-dd-theme="dark"] .muted{color:#c3b7c0}html[data-dd-theme="dark"] td,html[data-dd-theme="dark"] th{border-color:#453947}html[data-dd-theme="dark"] tr:hover{background:#332937}
</style><link rel="stylesheet" href="/admin/dd-shell.css"></head><body><header><h1>Customers</h1><p>Customer directory and order history</p></header><main><p id="notice" class="notice"></p><section class="panel"><h2>Customer directory</h2><label>Search name, phone or email</label><input id="search" placeholder="Find customer"><p class="muted">Customer profiles are grouped by email or phone when available. Guest orders without matching contact details may appear separately.</p><div class="scroll"><table><thead><tr><th>Customer</th><th>Contact</th><th>Orders</th><th>Total spending</th><th>History</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="panel" id="history" hidden><h2 id="historyTitle"></h2><div id="historyRows"></div></section></main><script src="/admin/dd-shell.js"></script><script>
const $=id=>document.getElementById(id);
const money=n=>'₱'+(Number(n||0)/100).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const customer=o=>{try{return JSON.parse(o.customer_json||'{}')}catch{return {}}};
async function fetchData(url,options){const r=await fetch(url,{credentials:'same-origin',...options});let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}

let groups=[];
async function load(){try{const d=await fetchData('/api/admin/orders');const map=new Map();for(const o of d.orders){const c=customer(o),key=(c.email||c.phone||o.id).toLowerCase().trim();if(!map.has(key))map.set(key,{name:c.name||'Guest customer',phone:c.phone||'',email:c.email||'',orders:[]});map.get(key).orders.push(o)}groups=[...map.values()].sort((a,b)=>b.orders.length-a.orders.length);render()}catch(e){$('notice').textContent=e.message}}
function render(){const q=$('search').value.toLowerCase();const rows=groups.map((g,i)=>({g,i})).filter(({g})=>(g.name+' '+g.phone+' '+g.email).toLowerCase().includes(q));$('rows').innerHTML=rows.map(({g,i})=>'<tr><td>'+esc(g.name)+'</td><td>'+esc(g.phone)+'<br>'+esc(g.email)+'</td><td>'+g.orders.length+'</td><td>'+money(g.orders.reduce((n,o)=>n+Number(o.total_centavos||0),0))+'</td><td><button data-index="'+i+'">View orders</button></td></tr>').join('')||'<tr><td colspan="5">No customers found</td></tr>';document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{const g=groups[Number(b.dataset.index)];$('history').hidden=false;$('historyTitle').textContent=g.name+' · Order history';$('historyRows').innerHTML=g.orders.map(o=>'<p><b>'+esc(o.id)+'</b> · '+esc(o.created_at)+' · '+money(o.total_centavos)+' · '+esc(o.status)+' · '+esc(o.payment_status||'Legacy')+'</p>').join('');$('history').scrollIntoView({behavior:'smooth'})})}
$('search').oninput=render;load();
</script></body></html>
