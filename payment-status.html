<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Status | Done Deal</title><style>body{margin:0;background:#14151b;color:#f7f7fb;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.card{max-width:520px;background:#252630;border:1px solid #42434e;border-radius:22px;padding:35px;margin:20px}a{color:#fa4a90}p{color:#ccc}h1{font-size:27px}</style></head><body><div class="card"><h1>Done Deal — Payment status</h1><p id="message">Checking your order securely…</p><p id="ref"></p><a href="shop.html">Continue shopping</a></div><script>const id=new URLSearchParams(location.search).get('order');const m=document.getElementById('message');document.getElementById('ref').textContent=id?'Order reference: '+id:'';async function check(){if(!id){m.textContent='No order reference provided.';return}try{const r=await fetch('/api/order-status?order='+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to check status');if(d.status==='paid'){m.textContent='Payment confirmed. Thank you for your order!';localStorage.removeItem('doneDealCart')}else if(d.status==='pending'){m.textContent='Payment not yet confirmed. Please wait or check again shortly.'}else m.textContent='Order status: '+d.status}catch(e){m.textContent=e.message}}check();</script></body></html>
