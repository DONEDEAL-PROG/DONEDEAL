<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DONEDEAL | Staff Orders</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111116;color:#f7f7fc;font:16px system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:22px}.panel{background:#1d1d26;border:1px solid #37303a;border-radius:14px;padding:18px;margin:15px 0}input,select,textarea,button{font:inherit;border-radius:8px;padding:10px}input,select,textarea{width:100%;background:#292936;color:#fff;border:1px solid #5b5665}button{border:0;background:#e72d81;color:white;cursor:pointer;margin:4px}button:disabled{opacity:.5}label{display:block;margin-top:12px}a{color:#ff8cbd}.order{display:block;width:100%;text-align:left;background:#30303d;margin:5px 0}.layout{display:grid;grid-template-columns:300px 1fr;gap:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere}#notice{color:#ff9ec7}@media(max-width:720px){.layout{grid-template-columns:1fr}}</style></head><body><main><a href="/staff/">← Support Inbox</a><h1>Staff Order Management</h1><p>Changes require customer authorization and a recorded reason. Refund approval does not automatically return money.</p><p id="notice" role="status"></p><div class="layout"><section class="panel"><label>Search order ID or customer<input id="query" placeholder="Search orders"></label><button id="search" type="button">Search</button><div id="orders"></div></section><section class="panel"><h2 id="title">Select an order</h2><pre id="info"></pre><div id="actions" hidden><label>Reason / customer authorization reference<textarea id="reason" maxlength="500" placeholder="Describe customer confirmation and reason"></textarea></label><section id="editArea" hidden><h3>Edit customer details</h3><label>Name<input id="name"></label><label>Phone<input id="phone"></label><label>Address<input id="address"></label><button id="saveEdit" type="button">Save details</button></section><section id="paymentArea" hidden><h3>Payment method (unpaid orders only)</h3><select id="method"><option value="cod">COD</option><option value="gcash">GCash</option><option value="bank_transfer">Bank transfer</option><option value="cash">Cash</option></select><button id="savePayment" type="button">Change method</button></section><section id="cancelArea" hidden><h3>Cancellation</h3><button id="cancelOrder" type="button">Cancel eligible order</button></section><section id="refundArea" hidden><h3>Refund request</h3><button id="requestRefund" type="button">Submit for Admin review</button></section></div></section></div></main><script src="/staff/orders.js" defer></script></body></html>
