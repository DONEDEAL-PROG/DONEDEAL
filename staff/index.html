<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DONEDEAL | Staff Support</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111116;color:#f7f7fc;font:16px system-ui,sans-serif}header{padding:18px 5%;background:#1d1d26}header a{color:#ff8cbd}main{max-width:1100px;margin:25px auto;padding:0 18px}.panel{background:#1d1d26;border:1px solid #37303a;border-radius:14px;padding:18px;margin-bottom:15px}input,textarea,select,button{font:inherit;border-radius:8px;padding:10px}input,textarea,select{width:100%;background:#292936;color:white;border:1px solid #5b5665}button{border:0;background:#e72d81;color:white;cursor:pointer}button:disabled{opacity:.5}.layout{display:grid;grid-template-columns:310px 1fr;gap:16px}.ticket{width:100%;text-align:left;margin:5px 0;background:#30303d}.bubble{padding:12px;background:#343441;border-radius:9px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.agent{background:#562b46;margin-left:12%}#messages{height:380px;overflow:auto;background:#15151d;border-radius:8px;padding:12px}label{display:block;margin:10px 0 5px}small{color:#bbb}#notice{color:#ff9ec7}textarea{min-height:85px}#login{max-width:440px;margin:65px auto}@media(max-width:720px){.layout{grid-template-columns:1fr}}</style></head><body>
<header><a href="/">← DONEDEAL</a> <span style="float:right">Customer Service Staff</span></header>
<main><section id="login" class="panel" hidden><h1>Staff sign in</h1><form id="loginForm"><label for="username">Username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><p><button>Sign in</button></p></form></section>
<section id="app" hidden><h1>Customer Support Inbox</h1><p><a href="/staff/orders.html">📦 Open Order Management (Phase 3)</a></p><p><span id="staffName"></span> · <button id="logout" type="button">Sign out</button></p><div class="layout"><section class="panel"><h2>Tickets</h2><button id="reload" type="button">Refresh</button><div id="tickets"></div></section><section class="panel"><h2 id="heading">Select a ticket</h2><p id="details"></p><div id="messages"></div><form id="reply" hidden><label for="message">Reply</label><textarea id="message" maxlength="2000" required></textarea><p><button>Send reply</button></p></form><div id="statusArea" hidden><label for="state">Ticket status</label><select id="state"><option value="open">Open</option><option value="pending">Pending</option><option value="closed">Closed</option></select><p><button id="saveState" type="button">Save status</button></p></div><div id="assignArea" hidden><label for="assignee">Assign to agent</label><select id="assignee"></select><p><button id="saveAssign" type="button">Assign ticket</button></p></div></section></div></section><p id="notice" role="status"></p></main><script src="/staff/staff.js" defer></script></body></html>
